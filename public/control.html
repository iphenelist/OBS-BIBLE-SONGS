<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Control Panel</title>
<style>
  :root {
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: #14161c;
    color: #e8e8ec;
    padding: 24px;
  }

  h1 {
    font-size: 1.4rem;
    margin: 0 0 20px 0;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: #1e2129;
    border: 1px solid #2c3038;
    border-radius: 10px;
    padding: 18px 20px;
  }

  .card h2 {
    margin-top: 0;
    font-size: 1.1rem;
    color: #f1c40f;
  }

  label {
    display: block;
    font-size: 0.8rem;
    color: #9aa0aa;
    margin-bottom: 4px;
  }

  input, select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #383d47;
    background: #0f1116;
    color: #e8e8ec;
    font-size: 0.95rem;
    margin-bottom: 12px;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  .row > div {
    flex: 1;
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 0.95rem;
    font-weight: 600;
  }

  .btn-primary {
    background: #f1c40f;
    color: #14161c;
  }

  .btn-primary:hover { background: #f7d341; }

  .btn-nav {
    background: #0f1116;
    color: #e8e8ec;
    border: 1px solid #383d47;
  }

  .btn-nav:hover:not(:disabled) { border-color: #f1c40f; color: #f1c40f; }

  .btn-nav:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-push {
    background: #2ecc71;
    color: #0e1a12;
    width: 100%;
    margin-top: 10px;
  }

  .btn-push:hover { background: #45db85; }

  .btn-hide {
    background: #e74c3c;
    color: #ffffff;
    width: 100%;
    padding: 16px;
    font-size: 1.1rem;
  }

  .btn-hide:hover { background: #f2604f; }

  .preview {
    margin-top: 14px;
    padding: 14px;
    border-radius: 8px;
    background: #0f1116;
    border: 1px solid #2c3038;
    min-height: 40px;
  }

  .preview .en {
    font-weight: 600;
    margin-bottom: 6px;
  }

  .preview .sw {
    color: #f1c40f;
    font-style: italic;
  }

  .preview .ref {
    margin-top: 8px;
    font-size: 0.75rem;
    color: #777;
    text-align: right;
    text-transform: uppercase;
  }

  .status {
    font-size: 0.8rem;
    margin-bottom: 16px;
    color: #9aa0aa;
  }

  .status.connected { color: #2ecc71; }
  .status.disconnected { color: #e74c3c; }

  .stanzas {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 14px;
    max-height: 420px;
    overflow-y: auto;
  }

  .stanza-card {
    background: #0f1116;
    border: 1px solid #2c3038;
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .stanza-card:hover {
    border-color: #f1c40f;
    background: #16181f;
  }

  .stanza-card .stanza-label {
    font-size: 0.7rem;
    color: #777;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .stanza-card .stanza-text {
    white-space: pre-line;
    font-size: 0.9rem;
    line-height: 1.4;
  }

  .lang-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .lang-toggle button {
    flex: 1;
    background: #0f1116;
    color: #9aa0aa;
    border: 1px solid #383d47;
  }

  .lang-toggle button.active {
    background: #f1c40f;
    color: #14161c;
    border-color: #f1c40f;
  }

  .full-width {
    grid-column: 1 / -1;
  }
</style>
</head>
<body>
  <h1>OBS Bible &amp; Songs — Operator Control Panel</h1>
  <div id="status" class="status disconnected">Connecting to overlay…</div>

  <div class="grid">
    <div class="card">
      <h2>Bible Search</h2>
      <div class="row">
        <div>
          <label for="book">Book</label>
          <select id="book">
            <option value="">Loading books…</option>
          </select>
        </div>
        <div>
          <label for="chapter">Chapter</label>
          <input id="chapter" type="number" min="1" placeholder="3" />
        </div>
        <div>
          <label for="verse">Verse</label>
          <input id="verse" type="number" min="1" placeholder="16" />
        </div>
      </div>
      <div class="row">
        <button type="button" class="btn-primary" id="bibleSearchBtn">Search</button>
        <button type="button" class="btn-nav" id="biblePrevBtn" title="Previous verse">&larr; Prev</button>
        <button type="button" class="btn-nav" id="bibleNextBtn" title="Next verse">Next &rarr;</button>
      </div>

      <div class="preview" id="biblePreview">
        <div class="en" id="biblePreviewPrimary">—</div>
        <div class="sw" id="biblePreviewSecondary"></div>
        <div class="ref" id="biblePreviewRef"></div>
      </div>
      <button type="button" class="btn-push" id="biblePushBtn">Push Live</button>
    </div>

    <div class="card">
      <h2>Songs</h2>
      <div class="lang-toggle">
        <button type="button" id="langEnBtn" class="active">English</button>
        <button type="button" id="langSwBtn">Swahili</button>
      </div>
      <label for="songSelect">Song</label>
      <select id="songSelect">
        <option value="">Loading songs…</option>
      </select>

      <div class="stanzas" id="stanzaList"></div>
    </div>

    <div class="card full-width">
      <button type="button" class="btn-hide" id="hideBtn">Clear Screen / Hide Overlay</button>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    let ws;

    function connect() {
      ws = new WebSocket(`ws://${location.host}`);
      ws.addEventListener('open', () => {
        statusEl.textContent = 'Connected to overlay';
        statusEl.className = 'status connected';
      });
      ws.addEventListener('close', () => {
        statusEl.textContent = 'Disconnected — retrying…';
        statusEl.className = 'status disconnected';
        setTimeout(connect, 1500);
      });
      ws.addEventListener('error', () => ws.close());
    }
    connect();

    function send(payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
      }
    }

    // ---------- Bible ----------

    let currentVerse = null;

    async function loadBookList() {
      const bookSelect = document.getElementById('book');
      const res = await fetch('/api/books');
      const books = await res.json();

      bookSelect.innerHTML = '<option value="">Select a book…</option>';
      for (const b of books) {
        const opt = document.createElement('option');
        opt.value = b.english;
        opt.textContent = `${b.english} / ${b.swahili}`;
        bookSelect.appendChild(opt);
      }
    }
    loadBookList();

    async function searchVerse() {
      const book = document.getElementById('book').value.trim();
      const chapter = document.getElementById('chapter').value.trim();
      const verse = document.getElementById('verse').value.trim();
      if (!book || !chapter || !verse) return;

      const res = await fetch(`/api/bible?book=${encodeURIComponent(book)}&chapter=${chapter}&verse=${verse}`);
      const data = await res.json();

      if (!res.ok) {
        document.getElementById('biblePreviewPrimary').textContent = data.error || 'Not found';
        document.getElementById('biblePreviewSecondary').textContent = '';
        document.getElementById('biblePreviewRef').textContent = '';
        currentVerse = null;
        return;
      }

      currentVerse = {
        primary: data.swahili_text,
        secondary: data.english_text,
        reference: `${data.book_swahili.toUpperCase()} ${data.chapter}:${data.verse}`,
      };

      document.getElementById('biblePreviewPrimary').textContent = currentVerse.primary;
      document.getElementById('biblePreviewSecondary').textContent = currentVerse.secondary;
      document.getElementById('biblePreviewRef').textContent = currentVerse.reference;
    }

    let isBibleLive = false;

    function pushLive() {
      if (!currentVerse) return;
      send({ action: 'SHOW', ...currentVerse });
      isBibleLive = true;
    }

    document.getElementById('bibleSearchBtn').addEventListener('click', searchVerse);

    document.getElementById('bibleNextBtn').addEventListener('click', async () => {
      const verseInput = document.getElementById('verse');
      const current = parseInt(verseInput.value, 10);
      verseInput.value = (Number.isFinite(current) ? current : 0) + 1;
      await searchVerse();
      if (isBibleLive) pushLive();
    });

    document.getElementById('biblePrevBtn').addEventListener('click', async () => {
      const verseInput = document.getElementById('verse');
      const current = parseInt(verseInput.value, 10);
      if (!Number.isFinite(current) || current <= 1) return;
      verseInput.value = current - 1;
      await searchVerse();
      if (isBibleLive) pushLive();
    });

    document.getElementById('biblePushBtn').addEventListener('click', pushLive);

    // ---------- Songs ----------

    let lang = 'en';
    const songSelect = document.getElementById('songSelect');
    const stanzaList = document.getElementById('stanzaList');
    const langEnBtn = document.getElementById('langEnBtn');
    const langSwBtn = document.getElementById('langSwBtn');

    async function loadSongList() {
      songSelect.innerHTML = '<option value="">Loading songs…</option>';
      stanzaList.innerHTML = '';
      const res = await fetch(`/api/songs?lang=${lang}`);
      const songs = await res.json();

      songSelect.innerHTML = '<option value="">Select a song…</option>';
      for (const song of songs) {
        const opt = document.createElement('option');
        opt.value = song.id;
        opt.textContent = song.title;
        songSelect.appendChild(opt);
      }
    }

    langEnBtn.addEventListener('click', () => {
      lang = 'en';
      langEnBtn.classList.add('active');
      langSwBtn.classList.remove('active');
      loadSongList();
    });

    langSwBtn.addEventListener('click', () => {
      lang = 'sw';
      langSwBtn.classList.add('active');
      langEnBtn.classList.remove('active');
      loadSongList();
    });

    songSelect.addEventListener('change', async () => {
      stanzaList.innerHTML = '';
      const id = songSelect.value;
      if (!id) return;

      const res = await fetch(`/api/songs/${encodeURIComponent(id)}?lang=${lang}`);
      if (!res.ok) return;
      const data = await res.json();

      const stanzas = data.lyrics.split(/\n\s*\n/).map((s) => s.trim()).filter(Boolean);

      stanzas.forEach((stanza, idx) => {
        const card = document.createElement('div');
        card.className = 'stanza-card';

        const label = document.createElement('div');
        label.className = 'stanza-label';
        label.textContent = `Stanza ${idx + 1}`;

        const text = document.createElement('div');
        text.className = 'stanza-text';
        text.textContent = stanza;

        card.appendChild(label);
        card.appendChild(text);

        card.addEventListener('click', () => {
          send({
            action: 'SHOW',
            primary: stanza,
            secondary: '',
            reference: `${data.title.toUpperCase()} - STANZA ${idx + 1}`,
          });
        });

        stanzaList.appendChild(card);
      });
    });

    loadSongList();

    // ---------- Global hide ----------

    document.getElementById('hideBtn').addEventListener('click', () => {
      isBibleLive = false;
      send({ action: 'HIDE' });
    });
  </script>
</body>
</html>
